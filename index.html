<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Dayflow"><link rel="manifest" href="manifest.json"><title>Dayflow — Personal AI Planner</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#20251f;--muted:#81877f;--line:#e8eae4;--green:#527b63;--greenbg:#e8f0e8;--blue:#eaf0f8;--lav:#f0ebf8;--peach:#f8eee5;--shadow:0 8px 28px #2635220b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--muted);font-weight:700}.brand{font-size:27px;letter-spacing:-1px;font-weight:760;margin-top:3px}.avatar{width:42px;height:42px;border-radius:15px;background:#e5ebe2;display:grid;place-items:center;color:#45644f;font-weight:750}.date-row{display:flex;align-items:center;justify-content:space-between;margin:16px 0}.date-row h2{font-size:19px;margin:0;letter-spacing:-.4px}.today-pill{background:#e9eee7;color:#52715a;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:700}.hero{background:#263b2f;color:white;border-radius:25px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffff1a;border-radius:50%;right:-55px;top:-70px;box-shadow:0 0 0 22px #ffffff08,0 0 0 45px #ffffff06}.hero-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.hero-label{font-size:12px;color:#c6d4c8}.hero-number{font-size:31px;font-weight:750;letter-spacing:-1px;margin-top:5px}.hero-number small{font-size:13px;color:#c6d4c8;font-weight:500;letter-spacing:0}.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#b8d3b9 var(--progress,45%),#ffffff26 0);position:relative}.ring:before{content:"";position:absolute;inset:5px;background:#263b2f;border-radius:50%}.ring span{z-index:1;font-size:12px;font-weight:700}.progress{height:5px;background:#ffffff27;border-radius:8px;margin:18px 0 12px;overflow:hidden}.progress i{height:100%;width:45%;display:block;background:#b8d3b9;border-radius:8px;transition:width .2s}.hero-foot{display:flex;justify-content:space-between;color:#c6d4c8;font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 1px 12px}.section-head h3{font-size:16px;margin:0;letter-spacing:-.3px}.text-btn{border:0;background:transparent;color:var(--green);font-weight:700;font-size:12px;padding:8px}.focus{background:#edf1e9;border:1px solid #e0e8dc;border-radius:19px;padding:15px;display:flex;gap:12px;align-items:center}.spark{width:40px;height:40px;display:grid;place-items:center;background:#dbe7d8;border-radius:13px;font-size:19px;flex-shrink:0}.focus strong{display:block;font-size:13px}.focus p{margin:4px 0 0;font-size:11px;line-height:1.45;color:#697568}.focus .arrow{margin-left:auto;color:#5a775f;font-size:20px}.filters{display:flex;gap:7px;overflow:auto;padding:1px 0 6px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-size:11px;color:#747b72}.filter.active{background:#263b2f;border-color:#263b2f;color:#fff}.timeline{position:relative;margin-top:8px}.item{display:grid;grid-template-columns:76px 16px minmax(0,1fr);gap:7px;min-height:76px}.time{font-size:10px;color:var(--muted);padding-top:15px;line-height:1.4}.track{position:relative;display:flex;justify-content:center}.track:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:#dfe3db}.dot{z-index:1;margin-top:17px;width:9px;height:9px;border:2px solid var(--green);background:var(--bg);border-radius:50%}.task-card{align-self:start;background:var(--card);border:1px solid #eceee8;border-radius:16px;padding:12px;margin:3px 0 10px;box-shadow:0 3px 12px #17231604;display:flex;gap:10px;align-items:flex-start}.task-card.done{opacity:.55}.check{width:20px;height:20px;border:1.5px solid #cbd3c7;border-radius:7px;flex-shrink:0;display:grid;place-items:center;background:white;color:white;padding:0;margin-top:1px}.done .check{background:var(--green);border-color:var(--green)}.task-main{min-width:0;flex:1}.task-title{font-size:12px;font-weight:680;line-height:1.35}.done .task-title{text-decoration:line-through}.task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{font-size:9px;font-weight:650;padding:4px 7px;border-radius:6px;background:var(--greenbg);color:#52715a}.tag.work{background:var(--blue);color:#5d7192}.tag.learning{background:var(--lav);color:#78699a}.tag.home{background:var(--peach);color:#9a7354}.tag.family{background:#f7e9ed;color:#9b6979}.mins{font-size:10px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}.fab{position:fixed;bottom:calc(23px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(484px,calc(100% - 36px));border:0;border-radius:17px;background:#263b2f;color:white;padding:16px;font-size:13px;font-weight:700;box-shadow:0 12px 30px #263b2f30;display:flex;justify-content:center;gap:9px;align-items:center}.fab span{font-size:20px;font-weight:400}.nav{position:fixed;bottom:0;left:0;right:0;padding:12px 22px calc(9px + env(safe-area-inset-bottom));background:#f7f7f4ed;backdrop-filter:blur(14px);display:flex;justify-content:space-around;border-top:1px solid #e6e8e1}.nav button{border:0;background:transparent;color:#8b9189;font-size:10px;display:flex;align-items:center;gap:5px;flex-direction:column}.nav button.active{color:#385642;font-weight:700}.nav b{font-size:19px;font-weight:500}.modal-back{position:fixed;inset:0;background:#17201975;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal-back.show{display:flex}.modal{width:min(520px,100%);background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{font-size:21px;margin:0}.close{border:0;background:#e8ebe4;border-radius:50%;width:32px;height:32px;font-size:18px}.field{display:block;margin:13px 0}.field label{display:block;font-size:11px;color:#737b71;font-weight:700;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid #e0e4db;background:white;border-radius:13px;padding:13px;font:inherit;font-size:13px;outline:none;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{border:0;background:#263b2f;color:white;border-radius:14px;padding:14px;width:100%;font-size:13px;font-weight:700;margin-top:8px}.recommend{background:#e8f0e8;border-radius:14px;padding:13px;margin-top:13px;font-size:12px;line-height:1.5;display:none}.recommend strong{display:block;margin-bottom:3px}.toast{position:fixed;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-15px);background:#263b2f;color:#fff;padding:11px 16px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){body{padding:20px 0}.app{border-radius:28px;background:var(--bg)}}
</style></head><body><main class="app">
<header class="top"><div><div class="eyebrow">YOUR PERSONAL PLANNER</div><div class="brand">dayflow<span style="color:#789477">.</span></div></div><div class="avatar">A</div></header>
<div class="date-row"><h2 id="dateTitle">Today, Friday</h2><span class="today-pill">MY DAILY FLOW</span></div>
<section class="hero"><div class="hero-head"><div><div class="hero-label">A little progress adds up</div><div class="hero-number"><span id="doneCount">0</span><small> / <span id="totalCount">0</span> tasks done</small></div></div><div class="ring" id="ring"><span id="pct">0%</span></div></div><div class="progress"><i id="progressBar"></i></div><div class="hero-foot"><span id="remainingText">Let's make today count.</span><span id="minutesText">Plan with balance</span></div></section>
<div class="section-head"><h3>Today's intention</h3><button class="text-btn" id="editIntention">Edit</button></div><section class="focus"><div class="spark">✦</div><div><strong id="intentionTitle">Progress, without the rush</strong><p id="intentionText">Protect your priorities. Leave room to breathe.</p></div><div class="arrow">›</div></section>
<div class="section-head"><h3>Your timeline</h3><button class="text-btn" id="resetDay">Reset demo</button></div><div class="filters" id="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Home">Home</button><button class="filter" data-filter="Family">Family</button><button class="filter" data-filter="Personal">Personal</button><button class="filter" data-filter="Work">Work</button><button class="filter" data-filter="Learning">Learning</button></div><section class="timeline" id="timeline"></section>
</main><button class="fab" id="addBtn"><span>＋</span> Add a task · Find a time slot</button><nav class="nav"><button class="active" data-tab="Today"><b>◷</b>Today</button><button data-tab="Week"><b>▦</b>Week</button><button data-tab="Library"><b>▤</b>Task library</button><button data-tab="Profile"><b>○</b>Settings</button></nav>
<div class="modal-back" id="modalBack"><section class="modal"><div class="modal-top"><h2 id="modalTitle">Add to your day</h2><button class="close" id="closeModal">×</button></div><form id="taskForm"><div class="field"><label for="taskName">WHAT DO YOU NEED TO DO?</label><input id="taskName" required placeholder="e.g. Review architecture proposal"></div><div class="grid2"><div class="field"><label for="taskCategory">CATEGORY</label><select id="taskCategory"><option>Work</option><option>Home</option><option>Family</option><option>Personal</option><option>Learning</option><option>Meeting</option></select></div><div class="field"><label for="taskDuration">DURATION</label><select id="taskDuration"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option><option value="180">3 hours</option></select></div></div><div class="grid2"><div class="field"><label for="taskPriority">PRIORITY</label><select id="taskPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="field"><label for="taskDeadline">NEED IT DONE BY</label><select id="taskDeadline"><option value="12">12:00 PM</option><option value="15">3:00 PM</option><option value="18" selected>6:00 PM</option><option value="21">9:00 PM</option><option value="23">End of day</option></select></div></div><div class="field"><label for="taskNotes">NOTES (OPTIONAL)</label><input id="taskNotes" placeholder="Any details to remember"></div><button type="button" class="primary" id="findSlot">✦ Find the best available slot</button><div class="recommend" id="recommend"></div><button type="submit" class="primary" id="saveTask" style="display:none">Add task to my day</button></form></section></div><div class="toast" id="toast"></div>
<script>
const seed=[
{id:1,start:5,end:7,title:"Kids' study time",category:"Family",duration:120,locked:true,done:false,detail:"Protected family routine"},
{id:2,start:7,end:8,title:"Cooking & home chores",category:"Home",duration:60,locked:true,done:false,detail:"Morning routine"},
{id:3,start:8,end:8.5,title:"Exercise & meditation",category:"Personal",duration:30,locked:true,done:false,detail:"Time for yourself"},
{id:4,start:8.5,end:9,title:"Get ready & plan the day",category:"Personal",duration:30,locked:false,done:false,detail:"A calm start"},
{id:5,start:9,end:10.5,title:"Architecture & delivery work",category:"Work",duration:90,locked:false,done:false,detail:"Focus block"},
{id:6,start:10.5,end:11.5,title:"Team meeting",category:"Meeting",duration:60,locked:true,done:false,detail:"Calendar commitment"},
{id:7,start:11.5,end:13,title:"Project work & reviews",category:"Work",duration:90,locked:false,done:false,detail:"Priority deliverables"},
{id:8,start:13,end:14,title:"Lunch & short break",category:"Personal",duration:60,locked:true,done:false,detail:"Recharge"},
{id:9,start:14,end:16,title:"Delivery work / collaboration",category:"Work",duration:120,locked:false,done:false,detail:"Flexible work block"},
{id:10,start:16,end:17,title:"Follow-ups & planning",category:"Work",duration:60,locked:false,done:false,detail:"Close open loops"},
{id:11,start:18,end:19,title:"Cooking & evening chores",category:"Home",duration:60,locked:true,done:false,detail:"Evening routine"},
{id:12,start:19.5,end:20.5,title:"AWS SAP-C02 learning",category:"Learning",duration:60,locked:false,done:false,detail:"Focused certification study"},
{id:13,start:20.5,end:21,title:"Family time & prepare for tomorrow",category:"Family",duration:30,locked:true,done:false,detail:"Wind down together"}
];
let tasks=JSON.parse(localStorage.getItem('dayflow_tasks')||'null')||seed;let filter='All',proposal=null;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('dayflow_tasks',JSON.stringify(tasks));const fmt=h=>{let hr=Math.floor(h),min=Math.round((h-hr)*60);return `${hr%12||12}${min?':'+String(min).padStart(2,'0'):''} ${hr>=12?'PM':'AM'}`};const dur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`):`${m}m`;const catClass=c=>['Home','Family','Learning'].includes(c)?c.toLowerCase():c==='Work'||c==='Meeting'?'work':'';
function render(){let completed=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(completed/total*100):0;$('doneCount').textContent=completed;$('totalCount').textContent=total;$('pct').textContent=pct+'%';$('ring').style.setProperty('--progress',pct+'%');$('progressBar').style.width=pct+'%';$('remainingText').textContent=total-completed?`${total-completed} tasks left — one step at a time`:'Everything on your list is done!';$('minutesText').textContent=`${pct}% complete`;
let list=tasks.filter(t=>filter==='All'||t.category===filter||(filter==='Work'&&t.category==='Meeting')).sort((a,b)=>a.start-b.start);$('timeline').innerHTML=list.length?list.map(t=>`<article class="item"><div class="time">${fmt(t.start)}<br>– ${fmt(t.end)}</div><div class="track"><span class="dot" style="${t.done?'background:#527b63;border-color:#527b63':''}"></span></div><div class="task-card ${t.done?'done':''}"><button class="check" aria-label="Mark ${t.title} complete" data-check="${t.id}">${t.done?'✓':''}</button><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="tag ${catClass(t.category)}">${esc(t.category)}</span><span class="mins">${dur(t.duration)}</span>${t.locked?'<span class="mins">· Fixed</span>':''}</div></div></div></article>`).join(''):'<div class="empty">No tasks in this category yet. Add one to get started.</div>';document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let t=tasks.find(x=>x.id==b.dataset.check);t.done=!t.done;save();render()});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
function openModal(){proposal=null;$('taskForm').reset();$('recommend').style.display='none';$('saveTask').style.display='none';$('modalTitle').textContent='Add to your day';$('modalBack').classList.add('show');setTimeout(()=>$('taskName').focus(),250)}function closeModal(){$('modalBack').classList.remove('show')}
function findSlot(){const name=$('taskName').value.trim();if(!name){$('taskName').focus();return}let minutes=+$('taskDuration').value,deadline=+$('taskDeadline').value,priority=$('taskPriority').value;let dayStart=5,dayEnd=22,blocked=tasks.filter(t=>t.locked||!t.done).map(t=>({s:t.start,e:t.end})).sort((a,b)=>a.s-b.s);let slots=[];for(let s=dayStart;s+minutes/60<=Math.min(dayEnd,deadline);s+=.25){let e=s+minutes/60;if(s<8.5|| (s>=8.5&&s<9) || (s>=17&&s<18) || (s>=19&&s<19.5))continue;if(!blocked.some(b=>s<b.e&&e>b.s))slots.push(s)}if(!slots.length){// allow placing into any gap, including gaps where flexible tasks can be moved
let points=[8.5,9,10,11,11.5,13,14,16,17,18,19,19.5,20.5,21];for(let s of points){let e=s+minutes/60;if(e<=Math.min(dayEnd,deadline)&&!blocked.some(b=>s<b.e&&e>b.s))slots.push(s)}}if(!slots.length){$('recommend').style.display='block';$('recommend').innerHTML='<strong>No clear free slot found</strong>Your day looks full before this deadline. Consider shortening the task, moving a flexible task, or choosing a later deadline.';$('saveTask').style.display='none';proposal=null;return}let chosen=priority==='High'?slots[0]:priority==='Low'?slots[slots.length-1]:slots[Math.min(1,slots.length-1)];proposal={start:chosen,end:chosen+minutes/60,minutes};$('recommend').style.display='block';$('recommend').innerHTML=`<strong>✦ Suggested slot: ${fmt(proposal.start)} – ${fmt(proposal.end)}</strong>${priority} priority · ${dur(minutes)}. This slot avoids your fixed commitments in the current plan. Review the suggestion before adding it.`;$('saveTask').style.display='block'}
$('addBtn').onclick=openModal;$('closeModal').onclick=closeModal;$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack'))closeModal()});$('findSlot').onclick=findSlot;$('taskName').addEventListener('input',()=>{proposal=null;$('saveTask').style.display='none';$('recommend').style.display='none'});$('taskDuration').onchange=()=>{proposal=null;$('saveTask').style.display='none';$('recommend').style.display='none'};$('taskDeadline').onchange=()=>{proposal=null;$('saveTask').style.display='none';$('recommend').style.display='none'};
$('taskForm').onsubmit=e=>{e.preventDefault();if(!proposal){findSlot();return}let category=$('taskCategory').value;tasks.push({id:Date.now(),start:proposal.start,end:proposal.end,title:$('taskName').value.trim(),category,duration:proposal.minutes,locked:false,done:false,detail:$('taskNotes').value.trim(),priority:$('taskPriority').value});save();filter='All';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='All'));render();closeModal();toast('Task added to your suggested slot')};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});$('resetDay').onclick=()=>{if(confirm('Restore the example schedule? Your current demo tasks will be replaced.')){tasks=seed.map(t=>({...t}));save();render();toast('Example schedule restored')}};$('editIntention').onclick=()=>{let a=prompt('What is your intention for today?',$('intentionTitle').textContent);if(a!==null&&a.trim()){$('intentionTitle').textContent=a.trim();localStorage.setItem('dayflow_intention',a.trim())}};if(localStorage.getItem('dayflow_intention'))$('intentionTitle').textContent=localStorage.getItem('dayflow_intention');let d=new Date();$('dateTitle').textContent='Today, '+d.toLocaleDateString('en-US',{weekday:'long'});render();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab!=='Today')toast(b.dataset.tab+' view is planned for the next version')});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
